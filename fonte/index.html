<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angenda - Gerenciador de Tarefas</title>
    <link rel="icon" type="image/png" href="/brand-icon.png">
    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <!-- Main Elm app node -->
    <div id="elm-app"></div>

    <!-- Elm compiled code -->
    <script src="/elm.js"></script>
    <!-- Custom wrapper code for ports & indexeddb -->
    <script>
        // IndexedDB integration for Angenda SPA

        const DB_NAME = 'angenda_db';
        const DB_VERSION = 1;

        let db = null;

        // Initialize Database
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (event) => {
                    const dbInstance = event.target.result;
                    if (!dbInstance.objectStoreNames.contains('tasks')) {
                        dbInstance.createObjectStore('tasks', { keyPath: 'id' });
                    }
                    if (!dbInstance.objectStoreNames.contains('routines')) {
                        dbInstance.createObjectStore('routines', { keyPath: 'id' });
                    }
                    if (!dbInstance.objectStoreNames.contains('plans')) {
                        dbInstance.createObjectStore('plans', { keyPath: 'id' });
                    }
                    if (!dbInstance.objectStoreNames.contains('config')) {
                        dbInstance.createObjectStore('config', { keyPath: 'id' });
                    }
                };

                request.onsuccess = (event) => {
                    db = event.target.result;
                    console.log('IndexedDB initialized successfully.');
                    resolve(db);
                };

                request.onerror = (event) => {
                    console.error('IndexedDB error:', event.target.error);
                    reject(event.target.error);
                };
            });
        }

        // Generic helper to get a single item from a store
        function getItem(storeName, key) {
            return new Promise((resolve, reject) => {
                if (!db) return reject(new Error('Database not initialized'));
                const transaction = db.transaction(storeName, 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.get(key);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Generic helper to get all items from a store
        function getAllItems(storeName) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    return reject(new Error('Database not initialized'));
                }
                const transaction = db.transaction(storeName, 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.getAll();

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Generic helper to save an item to a store
        function saveItem(storeName, item) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    return reject(new Error('Database not initialized'));
                }
                const transaction = db.transaction(storeName, 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put(item);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // Generic helper to delete an item from a store
        function deleteItem(storeName, key) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    return reject(new Error('Database not initialized'));
                }
                const transaction = db.transaction(storeName, 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.delete(key);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        let mqttClient = null;
        let mqttConnectionsMap = new Map();
        let appConfig = null;
        let mainApp = null; // To hold Elm app reference
        const SESSION_ID = window.crypto.randomUUID(); // Id único para evitar conflito de abas com mesmo nome

        function publishMqttMessage(type, action, payload) {
            if (mqttClient && appConfig && appConfig.mqttSyncEnabled) {
                const topic = 'angenda/' + appConfig.mqttTopic;
                const message = {
                    device: appConfig.mqttDeviceName || 'Dispositivo Anônimo',
                    sessionId: SESSION_ID,
                    type: type,
                    action: action,
                    payload: payload
                };
                mqttClient.publish(topic, JSON.stringify(message));
            }
        }

        function setupMqtt(config) {
            appConfig = config;
            if (mqttClient) {
                mqttClient.end();
                mqttClient = null;
            }

            if (!config || !config.mqttSyncEnabled || !config.mqttBrokerUrl || !config.mqttTopic) {
                if (mainApp && mainApp.ports.mqttStatusUpdate) mainApp.ports.mqttStatusUpdate.send('Desconectado');
                return;
            }

            if (mainApp && mainApp.ports.mqttStatusUpdate) mainApp.ports.mqttStatusUpdate.send('Conectando...');
            
            mqttClient = mqtt.connect(config.mqttBrokerUrl);

            mqttClient.on('connect', () => {
                if (mainApp && mainApp.ports.mqttStatusUpdate) mainApp.ports.mqttStatusUpdate.send('Conectado');
                const topic = 'angenda/' + config.mqttTopic;
                mqttClient.subscribe(topic);
            });

            mqttClient.on('error', (err) => {
                console.error('MQTT error:', err);
                if (mainApp && mainApp.ports.mqttStatusUpdate) mainApp.ports.mqttStatusUpdate.send('Erro de conexão');
            });

            mqttClient.on('message', async (topic, messageBuffer) => {
                try {
                    const messageStr = messageBuffer.toString();
                    const data = JSON.parse(messageStr);

                    if (data.sessionId === SESSION_ID) return; // Ignore own messages

                    // Update connections map
                    const deviceLabel = data.device || 'Dispositivo Anônimo';
                    mqttConnectionsMap.set(deviceLabel, new Date().toLocaleTimeString());
                    const connectionsList = Array.from(mqttConnectionsMap.entries()).map(([device, time]) => ({
                        deviceName: device,
                        lastSync: time
                    }));
                    if (mainApp && mainApp.ports.mqttConnectionsUpdate) {
                        mainApp.ports.mqttConnectionsUpdate.send(connectionsList);
                    }

                    const storeName = data.type; // 'tasks', 'routines', 'plans'
                    if (data.action === 'save') {
                        const incomingItem = data.payload;
                        const existingItem = await getItem(storeName, incomingItem.id).catch(() => null);

                        const incomingTime = incomingItem.updatedAt || 0;
                        const existingTime = existingItem ? (existingItem.updatedAt || 0) : -1;

                        if (incomingTime > existingTime) {
                            await saveItem(storeName, incomingItem);
                        }
                    } else if (data.action === 'delete') {
                        await deleteItem(storeName, data.payload);
                    }

                    // Reload UI
                    const tasks = await getAllItems('tasks');
                    const routines = await getAllItems('routines');
                    const plans = await getAllItems('plans');
                    if (mainApp && mainApp.ports.dataLoaded) {
                        mainApp.ports.dataLoaded.send({
                            tasks: tasks || [],
                            routines: routines || [],
                            plans: plans || [],
                            config: config
                        });
                    }
                } catch (err) {
                    console.error('Error processing MQTT message', err);
                }
            });
        }

        // Start Elm App and register Ports
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
            } catch (e) {
                console.error('Could not initialize database. Port sync will run with fallback storage.');
            }

            // Initialize Elm application with local today date as a flag
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            // Browser.application needs a flags argument, and returns { ports } if they are declared in Main.elm
            const app = Elm.Main.init({
                node: document.getElementById('elm-app'),
                flags: {
                    today: todayStr,
                    uuids: Array.from({ length: 100 }, () => window.crypto.randomUUID())
                }
            });
            mainApp = app;

            // Load initial config if any
            getAllItems('config').then(configs => {
                if (configs.length > 0) setupMqtt(configs[0]);
            }).catch(() => {});

            // Handle loadData command
            if (app.ports.loadData) {
                app.ports.loadData.subscribe(async () => {
                    try {
                        const tasks = await getAllItems('tasks');
                        const routines = await getAllItems('routines');
                        const plans = await getAllItems('plans');
                        const configs = await getAllItems('config');
                        const config = configs.length > 0 ? configs[0] : null;

                        console.log('Loaded from DB:', { tasks, routines, plans, config });

                        if (app.ports.dataLoaded) {
                            app.ports.dataLoaded.send({
                                tasks: tasks || [],
                                routines: routines || [],
                                plans: plans || [],
                                config: config
                            });
                        }
                    } catch (err) {
                        console.error('Error loading data from IndexedDB:', err);
                        // Fallback empty load
                        if (app.ports.dataLoaded) {
                            app.ports.dataLoaded.send({ tasks: [], routines: [], plans: [], config: null });
                        }
                    }
                });
            }

            // Handle requestUuids command
            if (app.ports.requestUuids) {
                app.ports.requestUuids.subscribe((count) => {
                    if (app.ports.receiveUuids) {
                        const uuids = Array.from({ length: count }, () => window.crypto.randomUUID());
                        app.ports.receiveUuids.send(uuids);
                    }
                });
            }

            // Handle saveTask command
            if (app.ports.saveTask) {
                app.ports.saveTask.subscribe(async (task) => {
                    try {
                        task.updatedAt = Date.now();
                        await saveItem('tasks', task);
                        console.log('Task saved to IndexedDB:', task.id);
                        publishMqttMessage('tasks', 'save', task);
                    } catch (err) {
                        console.error('Error saving task:', err);
                    }
                });
            }

            // Handle deleteTask command
            if (app.ports.deleteTask) {
                app.ports.deleteTask.subscribe(async (taskId) => {
                    try {
                        await deleteItem('tasks', taskId);
                        console.log('Task deleted from IndexedDB:', taskId);
                        publishMqttMessage('tasks', 'delete', taskId);
                    } catch (err) {
                        console.error('Error deleting task:', err);
                    }
                });
            }

            // Handle saveRoutine command
            if (app.ports.saveRoutine) {
                app.ports.saveRoutine.subscribe(async (routine) => {
                    try {
                        routine.updatedAt = Date.now();
                        await saveItem('routines', routine);
                        console.log('Routine saved to IndexedDB:', routine.id);
                        publishMqttMessage('routines', 'save', routine);
                    } catch (err) {
                        console.error('Error saving routine:', err);
                    }
                });
            }

            // Handle deleteRoutine command
            if (app.ports.deleteRoutine) {
                app.ports.deleteRoutine.subscribe(async (routineId) => {
                    try {
                        await deleteItem('routines', routineId);
                        console.log('Routine deleted from IndexedDB:', routineId);
                        publishMqttMessage('routines', 'delete', routineId);
                    } catch (err) {
                        console.error('Error deleting routine:', err);
                    }
                });
            }

            // Handle savePlan command
            if (app.ports.savePlan) {
                app.ports.savePlan.subscribe(async (plan) => {
                    try {
                        plan.updatedAt = Date.now();
                        await saveItem('plans', plan);
                        console.log('Plan saved to IndexedDB:', plan.id);
                        publishMqttMessage('plans', 'save', plan);
                    } catch (err) {
                        console.error('Error saving plan:', err);
                    }
                });
            }

            // Handle deletePlan command
            if (app.ports.deletePlan) {
                app.ports.deletePlan.subscribe(async (planId) => {
                    try {
                        await deleteItem('plans', planId);
                        console.log('Plan deleted from IndexedDB:', planId);
                        publishMqttMessage('plans', 'delete', planId);
                    } catch (err) {
                        console.error('Error deleting plan:', err);
                    }
                });
            }

            // Handle saveConfig command
            if (app.ports.saveConfig) {
                app.ports.saveConfig.subscribe(async (config) => {
                    try {
                        // We use a fixed ID for the config since there's only one
                        const configToSave = { ...config, id: 'main_config' };
                        await saveItem('config', configToSave);
                        console.log('Config saved to IndexedDB');
                        setupMqtt(configToSave);
                    } catch (err) {
                        console.error('Error saving config:', err);
                    }
                });
            }
        });
    </script>
</body>
</html>
