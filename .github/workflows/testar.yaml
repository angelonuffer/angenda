name: Testar
on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main
jobs:
  testar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: nix develop --command npm ci
      - run: nix develop --command npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7